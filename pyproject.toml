[project]
name = "dozou"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "dlt[duckdb]>=1.32.0",
    "duckdb>=1.5.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
    # chonkie and lancedb are pinned only for dlt-mcp's search_docs.
    # Newer versions fail with "Field 'metadata' not found in target schema".
    "chonkie[code,model2vec]==1.4.2",
    "conventional-pre-commit>=4.5.0",
    "dlt-mcp[search]>=0.3.0,<0.4",
    "flake8>=7.5.0",
    "lancedb>=0.25.3,<0.26",  # see the chonkie comment above
    "pre-commit>=4.7.0",
    "pymarkdownlnt>=0.9.42",
    "pytest>=9.2.0",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]

[tool.black]
target-version = ["py312"]

[tool.pymarkdown]
# Japanese docs are written one sentence per line, so line length is not limited.
plugins.md013.enabled = false
# Source tables in the strategy docs list plain URLs on purpose.
plugins.md034.enabled = false
# Bold-only list items are used as labels, not as headings.
plugins.md036.enabled = false
